appId: com.ppk.presensipraktikum
name: Izin lokasi ditolak
tags:
  - android
  - e2e
  - uat
---
- launchApp:
    clearState: true
    permissions:
      location: deny
      notifications: allow
- runFlow:
    file: ../subflows/login.yaml
- extendedWaitUntil:
    visible: "Daftar sesi"
    timeout: 20000
- openLink:
    link: "presensipraktikum://praktikan/presensi/${SESSION_ID}"
    browser: false
- extendedWaitUntil:
    visible: "Izin lokasi diperlukan untuk memastikan kamu berada di laboratorium."
    timeout: 30000
- assertVisible:
    text: "Presensi sekarang"
    enabled: false
