appId: com.ppk.presensipraktikum
name: Layanan lokasi mati
tags:
  - android
  - e2e
  - uat
---
- launchApp:
    clearState: true
    permissions:
      location: allow
      notifications: allow
- runFlow:
    file: ../subflows/login.yaml
- extendedWaitUntil:
    visible: "Daftar sesi"
    timeout: 20000
- openLink:
    link: "presensipraktikum://praktikan/presensi/${SESSION_ID}"
    browser: false
- extendedWaitUntil:
    visible: "Layanan lokasi nonaktif. Aktifkan lokasi perangkat, lalu periksa lagi."
    timeout: 30000
- assertVisible:
    text: "Buka pengaturan lokasi"
