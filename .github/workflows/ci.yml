name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Test functions
        run: npm --prefix functions test -- --ci --runInBand

      - name: Build functions
        run: npm --prefix functions run build

      - name: Check whitespace
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --check "$BASE"..HEAD
          else
            git show --check --oneline --no-renames HEAD
          fi

  rules-e2e:
    name: Firestore rules E2E
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Read E2E tool versions
        id: tool-versions
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          FIREBASE_TOOLS_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/firebase-tools'].version")
          echo "playwright=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"
          echo "firebase_tools=$FIREBASE_TOOLS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Firebase emulator
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-rules-${{ steps.tool-versions.outputs.firebase_tools }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore rules E2E
        run: npm run test:rules

  web-e2e:
    name: Web E2E
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Read E2E tool versions
        id: tool-versions
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          FIREBASE_TOOLS_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/firebase-tools'].version")
          echo "playwright=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"
          echo "firebase_tools=$FIREBASE_TOOLS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Firebase emulator
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-web-${{ steps.tool-versions.outputs.firebase_tools }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.tool-versions.outputs.playwright }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Headless shell cukup untuk E2E dan menghindari apt-get --with-deps yang lambat.
      - name: Install Playwright Chromium (headless shell)
        run: npx playwright install --only-shell chromium

      - name: Run web E2E
        run: npm run test:web

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-web-e2e
          path: |
            e2e/web/playwright-report
            e2e/web/test-results
          if-no-files-found: ignore
          retention-days: 7
